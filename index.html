<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
    <title>SFX | مسیر کنکور ۱۴۰۶</title>
    <style>
        /* ===== reset & base ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #0b0e16;
            --panel: #121724;
            --panel2: #171d2d;
            --panel3: #1b2234;
            --text: #eef1f8;
            --muted: #929bb1;
            --line: #252d40;
            --accent: #8b7cff;
            --accent2: #b19dff;
            --cyan: #51d5e8;
            --green: #43d19b;
            --orange: #ffb454;
            --red: #ff6b78;
            --shadow: 0 18px 45px rgba(0, 0, 0, .24);
        }
        html {
            min-width: 320px;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at 80% -10%, #28204b 0, #0b0e16 36%);
            color: var(--text);
            font-family: "Vazirmatn", "Vazir", "Segoe UI", Tahoma, sans-serif;
            font-size: 14px;
            overflow-x: hidden;
            min-height: 100vh;
        }
        button,
        input,
        select,
        textarea {
            font: inherit;
            cursor: pointer;
            border: 0;
        }
        a {
            color: var(--text);
            text-decoration: none;
        }

        /* ===== auth modal ===== */
        #authModal {
            position: fixed;
            inset: 0;
            background: #05070be8;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #authModal .auth-box {
            background: #151b2a;
            border: 1px solid #303a52;
            border-radius: 18px;
            padding: 30px;
            width: 380px;
            max-width: 92vw;
            box-shadow: 0 30px 80px #0009;
            text-align: center;
        }
        #authModal .auth-box h3 {
            margin: 0 0 8px;
            font-size: 18px;
            color: #eef1f8;
        }
        #authModal .auth-box p {
            color: #929bb1;
            font-size: 12px;
            margin-bottom: 20px;
        }
        #authModal .auth-box input {
            width: 100%;
            background: #0e131e;
            color: #eef1f8;
            border: 1px solid #293247;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            font-size: 16px;
            letter-spacing: 4px;
            outline: none;
            margin-bottom: 15px;
        }
        #authModal .auth-box button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: linear-gradient(135deg, #8172f4, #6255d8);
            color: #fff;
            font-weight: bold;
            border: 0;
            cursor: pointer;
        }
        #authError {
            color: #ff6b78;
            font-size: 11px;
            margin-top: 10px;
            display: none;
        }

        /* ===== app layout ===== */
        .app {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 255px;
            background: rgba(13, 16, 26, .98);
            border-left: 1px solid var(--line);
            padding: 25px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 90;
            transition: .3s ease;
            overflow-y: auto;
        }
        .brand {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 0 8px 28px;
        }
        .brand-icon {
            width: 45px;
            height: 45px;
            border-radius: 14px;
            background: linear-gradient(135deg, #9b8cff, #5f50db);
            display: grid;
            place-items: center;
            font-size: 22px;
            box-shadow: 0 10px 28px #7768ef3b;
        }
        .brand b {
            font-size: 16px;
            display: block;
        }
        .brand small {
            display: block;
            color: #7f899f;
            font-size: 11px;
            margin-top: 4px;
        }
        nav {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .nav {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 13px 14px;
            border-radius: 12px;
            background: transparent;
            color: #9ca5ba;
            text-align: right;
            transition: .18s;
        }
        .nav span {
            width: 23px;
            text-align: center;
            font-size: 16px;
        }
        .nav:hover {
            background: #ffffff09;
            color: #fff;
        }
        .nav.active {
            background: linear-gradient(90deg, #6b5de3, #584bc4);
            color: #fff;
            box-shadow: 0 8px 22px #6256d638;
        }
        .sidebar-bottom {
            margin-top: auto;
            color: #49d49c;
            font-size: 11px;
            line-height: 2;
            padding: 12px 8px;
        }
        .sidebar-bottom small {
            color: #68738b;
        }
        .main {
            margin-right: 255px;
            width: calc(100% - 255px);
            padding: 28px 34px 60px;
            max-width: 1500px;
            transition: .3s ease;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .eyebrow {
            color: var(--accent2);
            font-size: 11px;
            font-weight: 700;
        }
        .topbar h1 {
            margin: 5px 0 0;
            font-size: 28px;
            letter-spacing: -.5px;
        }
        .today-chip {
            padding: 11px 15px;
            background: #121725cc;
            border: 1px solid var(--line);
            border-radius: 12px;
            color: #aab2c4;
            font-size: 12px;
            white-space: nowrap;
        }

        /* ===== grid & cards ===== */
        .grid {
            display: grid;
            gap: 16px;
        }
        .g2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .g3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .g4 {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .card {
            background: linear-gradient(145deg, #141a29, #111621);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 20px;
            box-shadow: var(--shadow);
            min-width: 0;
            overflow-x: auto;
        }
        .stat {
            min-height: 140px;
            position: relative;
            overflow: hidden;
        }
        .stat:after {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            left: -38px;
            bottom: -45px;
            background: #8b7cff0d;
        }
        .ico {
            font-size: 22px;
        }
        .label {
            color: var(--muted);
            font-size: 12px;
            margin-top: 13px;
        }
        .num {
            font-size: 29px;
            font-weight: 900;
            margin-top: 5px;
        }
        .sub,
        .mini {
            font-size: 11px;
            color: var(--muted);
            margin-top: 5px;
        }
        .hero {
            background: linear-gradient(135deg, #1b2037 0%, #40337d 100%);
            border-color: #6658bd77;
            position: relative;
            overflow: hidden;
        }
        .hero:before,
        .hero:after {
            content: "";
            position: absolute;
            border: 1px solid #ffffff12;
            border-radius: 50%;
        }
        .hero:before {
            width: 380px;
            height: 380px;
            left: -170px;
            top: -230px;
        }
        .hero:after {
            width: 260px;
            height: 260px;
            right: -100px;
            bottom: -190px;
        }
        .hero-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .muted {
            color: var(--muted);
            font-size: 11px;
        }
        .hero .muted {
            color: #c6c5d9;
        }
        .count {
            font-size: 46px;
            font-weight: 900;
            letter-spacing: -2px;
            margin: 8px 0;
        }
        .ring {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: conic-gradient(var(--accent2) var(--p), #ffffff19 0);
            flex-shrink: 0;
        }
        .ring:after {
            content: attr(data-text);
            width: 77px;
            height: 77px;
            border-radius: 50%;
            background: #292451;
            display: grid;
            place-items: center;
            font-weight: 900;
        }
        .progress {
            height: 8px;
            background: #232a3b;
            border-radius: 99px;
            overflow: hidden;
        }
        .progress i {
            display: block;
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--accent), var(--cyan));
        }
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 28px 0 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .section-title h2 {
            font-size: 16px;
            margin: 0;
        }
        .btn {
            padding: 10px 14px;
            border-radius: 10px;
            background: #20283a;
            color: #b9c1d3;
            border: 1px solid #2b354a;
            font-size: 12px;
            white-space: nowrap;
        }
        .btn:hover {
            filter: brightness(1.12);
        }
        .btn.primary {
            background: linear-gradient(135deg, #8172f4, #6255d8);
            color: #fff;
            border-color: #8376f5;
        }
        .btn.danger {
            background: #321d26;
            color: #ff8992;
            border-color: #522632;
        }
        .btn.success {
            background: #17362e;
            color: #57dfae;
            border-color: #255d4d;
        }
        .btn.cyan {
            background: #14323a;
            color: #62dceb;
            border-color: #235b66;
        }
        .btn.warning {
            background: #3a2f14;
            color: #ebc062;
            border-color: #665423;
        }
        .form {
            display: grid;
            gap: 13px;
        }
        .form label {
            display: grid;
            gap: 7px;
            color: #aeb6c7;
            font-size: 11px;
        }
        .form input,
        .form select,
        .form textarea {
            width: 100%;
            background: #0e131e;
            color: #eef1f8;
            border: 1px solid #293247;
            border-radius: 10px;
            padding: 11px 12px;
            outline: none;
        }
        .form input:focus,
        .form select:focus,
        .form textarea:focus {
            border-color: #796bf0;
            box-shadow: 0 0 0 3px #796bf014;
        }
        .row {
            display: flex;
            gap: 9px;
            align-items: center;
            flex-wrap: wrap;
        }
        .between {
            justify-content: space-between;
        }
        .notice {
            padding: 14px;
            border-radius: 12px;
            background: #181c30;
            border: 1px solid #292d4d;
            color: #bfc4db;
            font-size: 11px;
            line-height: 2;
        }
        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 13px;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
            font-size: 12px;
        }
        .table th {
            color: #7f8aa0;
            background: #101521;
            font-weight: 600;
            text-align: right;
            padding: 12px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }
        .table td {
            padding: 13px 12px;
            border-bottom: 1px solid #202738;
            color: #d9deea;
            white-space: nowrap;
        }
        .table tr:last-child td {
            border-bottom: 0;
        }
        .pill {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 8px;
            background: #252042;
            color: #b8aeff;
            font-size: 10px;
        }
        .good {
            color: var(--green);
        }
        .bad {
            color: var(--red);
        }
        .neutral {
            color: var(--cyan);
        }
        .chart {
            height: 260px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 22px 10px 10px;
            border-top: 1px solid var(--line);
            overflow-x: auto;
        }
        .barwrap {
            height: 100%;
            flex: 1;
            min-width: 22px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            gap: 7px;
        }
        .bar {
            width: min(34px, 72%);
            background: linear-gradient(180deg, var(--cyan), var(--accent));
            border-radius: 8px 8px 2px 2px;
            min-height: 3px;
            box-shadow: 0 5px 18px #6f63ed1e;
        }
        .barlabel {
            font-size: 9px;
            color: #7f899e;
            white-space: nowrap;
        }
        .pie-chart {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            margin: auto;
            box-shadow: 0 10px 30px #0005;
        }
        .pie-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            font-size: 11px;
        }
        .pie-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .pie-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }
        .subject-group {
            margin-top: 23px;
        }
        .group-title {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 12px;
        }
        .group-title .mark {
            width: 7px;
            height: 27px;
            border-radius: 10px;
            background: linear-gradient(var(--accent), var(--cyan));
        }
        .group-title h3 {
            margin: 0;
            font-size: 15px;
        }
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
        }
        .subject-card {
            min-height: 145px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .subject-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .subject-name {
            font-size: 14px;
            font-weight: 800;
        }
        .subject-icon {
            font-size: 22px;
        }
        .subject-stats {
            font-size: 10px;
            color: var(--muted);
            line-height: 1.9;
        }
        .timer-card {
            max-width: 900px;
            margin: auto;
            text-align: center;
        }
        .mode {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .mode button {
            padding: 9px 15px;
            border-radius: 9px;
            background: #1b2231;
            color: #8993a8;
            border: 1px solid #293247;
        }
        .mode button.active {
            background: #2a2550;
            color: #bdb5ff;
            border-color: #5b50ad;
        }
        .timer {
            font-size: 76px;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 22px 0 16px;
            font-variant-numeric: tabular-nums;
        }
        .timer-set {
            display: flex;
            justify-content: center;
            gap: 8px;
            align-items: end;
            max-width: 500px;
            margin: 0 auto 15px;
            flex-wrap: wrap;
        }
        .timer-set label {
            display: grid;
            gap: 6px;
            color: #8993a8;
            font-size: 10px;
            text-align: right;
        }
        .timer-set input {
            width: 80px;
            background: #0e131e;
            color: #fff;
            border: 1px solid #293247;
            border-radius: 9px;
            padding: 10px;
        }
        .timer-actions {
            display: flex;
            justify-content: center;
            gap: 9px;
            flex-wrap: wrap;
        }
        .bigbtn {
            padding: 12px 28px;
            border-radius: 11px;
            background: linear-gradient(135deg, #8a7cf8, #6355d7);
            color: white;
            font-weight: 800;
        }
        .goal-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161d2b;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #293247;
            margin-bottom: 8px;
        }
        .goal-item.done {
            opacity: 0.5;
            text-decoration: line-through;
        }
        .reminder-item {
            background: #1f273b;
            border-left: 3px solid var(--orange);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .kpi {
            font-size: 21px;
            font-weight: 900;
        }
        .empty {
            text-align: center;
            padding: 38px;
            color: var(--muted);
            font-size: 12px;
        }
        .switch {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid var(--line);
            border-radius: 13px;
            background: #101622;
        }
        .switch label {
            color: #c8cedb;
            font-size: 12px;
        }
        .switch input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }
        .modal {
            position: fixed;
            inset: 0;
            background: #05070bcc;
            display: grid;
            place-items: center;
            z-index: 99;
            backdrop-filter: blur(3px);
        }
        .modal.hidden {
            display: none !important;
        }
        .modal-box {
            width: 600px;
            max-width: 95vw;
            background: #151b2a;
            border: 1px solid #303a52;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 30px 80px #0009;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-box h3 {
            margin: 0 0 16px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }
        #toast {
            position: fixed;
            bottom: 24px;
            left: 25px;
            background: #1b2230;
            border: 1px solid #303a50;
            color: #fff;
            padding: 12px 17px;
            border-radius: 10px;
            font-size: 11px;
            opacity: 0;
            transform: translateY(10px);
            transition: .22s;
            z-index: 100;
        }
        #toast.show {
            opacity: 1;
            transform: none;
        }
        .badge-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .badge {
            background: #1b2234;
            border: 1px solid #2b354a;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 140px;
        }
        .badge-icon {
            font-size: 24px;
        }
        .badge-info {
            font-size: 11px;
        }
        .badge-info b {
            display: block;
            font-size: 13px;
            color: #fff;
        }
        .heatmap-wrap {
            overflow-x: auto;
            padding-bottom: 15px;
            direction: ltr;
        }
        .heatmap {
            display: grid;
            grid-template-rows: repeat(7, 1fr);
            grid-auto-flow: column;
            gap: 4px;
        }
        .heatmap-cell {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            background: #1b2234;
        }
        .heatmap-cell.lvl1 {
            background: #0f766e;
        }
        .heatmap-cell.lvl2 {
            background: #0d9488;
        }
        .heatmap-cell.lvl3 {
            background: #14b8a6;
        }
        .heatmap-cell.lvl4 {
            background: #5eead4;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .page-btn {
            padding: 8px 14px;
            background: #1b2234;
            border: 1px solid #2b354a;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
        }
        .page-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }
        .sound-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            border-top: 1px solid var(--line);
            padding-top: 20px;
            flex-wrap: wrap;
        }
        .sound-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 30px;
            background: #1b2231;
            border: 1px solid #293247;
            color: #8993a8;
            transition: .2s;
        }
        .sound-btn.playing {
            background: #1a3a3a;
            color: #4dd4b5;
            border-color: #215a4f;
        }
        .edit-btn {
            background: transparent;
            border: 0;
            color: #51d5e8;
            cursor: pointer;
            font-size: 12px;
            padding: 5px;
        }
        .edit-btn:hover {
            background: #51d5e822;
            border-radius: 6px;
        }
        .mobile-only {
            display: none;
        }
        .pomodoro-badge {
            background: #ff6b7822;
            color: #ff6b78;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            margin-right: 8px;
        }
        footer {
            margin-top: 50px;
            padding: 20px 0;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--muted);
            font-size: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* ===== responsive ===== */
        @media(max-width:1100px) {
            .g4 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .subject-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
        @media(max-width:768px) {
            .mobile-only {
                display: block;
            }
            .sidebar {
                transform: translateX(100%);
                width: 260px;

    <div id="modal" class="modal hidden"></div>
    <div id="toast"></div>

    <script>
        // ===== AUTH =====
        (function() {
            if (localStorage.getItem("sfx_authenticated") === "true") {
                document.getElementById("authModal").style.display = "none";
            }
            document.getElementById("authBtn").onclick = function() {
                var val = document.getElementById("authPassInput").value;
                var storedPass = localStorage.getItem("sfx_pass") || "9999";
                if (val === storedPass) {
                    localStorage.setItem("sfx_authenticated", "true");
                    document.getElementById("authModal").style.display = "none";
                } else {
                    document.getElementById("authError").style.display = "block";
                }
            };
            document.getElementById("authPassInput").onkeypress = function(e) {
                if (e.key === "Enter") document.getElementById("authBtn").click();
            };
        })();

        // ===== MOBILE MENU =====
        document.getElementById('openSidebar').onclick = function() {
            document.getElementById('sidebar').classList.add('open');
        };
        document.getElementById('closeSidebar').onclick = function() {
            document.getElementById('sidebar').classList.remove('open');
        };

        // ===== APP STATE =====
        var KEY = "konkur_tracker_v2";
        var USER_NAME = "آبان";
        var defaults = ["ریاضی", "فیزیک", "شیمی", "هندسه", "ادبیات", "دینی", "زبان", "عربی"];
        var state = JSON.parse(localStorage.getItem(KEY) || "null") || {
            targetHours: 8,
            targetTests: 80,
            theme: "dark",
            compact: false,
            startDate: key(new Date()),
            subjects: defaults.map(function(name) { return { name: name }; }),
            days: {},
            sessions: [],
            tests: [],
            goals: [],
            exams: [],
            reminders: []
        };
        if (!state.startDate) state.startDate = key(new Date());

        function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

        function pad(n) { return String(n).padStart(2, "0"); }

        function key(d) { d = d || new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

        function faDate(d) { d = d || new Date(); return new Intl.DateTimeFormat("fa-IR", { weekday: "long", year: "numeric",
                month: "long", day: "numeric" }).format(d); }

        function remain() { var end = new Date(2027, 6 - 1, 30, 23, 59, 59),
                now = new Date(); return Math.max(0, Math.ceil((end - now) / 86400000)); }

        function mins(k) { return state.sessions.filter(function(x) { return x.date === k; }).reduce(function(a, x) { return a +
                    Number(x.minutes || 0); }, 0); }

        function tests(k) { return state.tests.filter(function(x) { return x.date === k; }).reduce(function(a, x) { return a +
                    Number(x.count || 0); }, 0); }

        function fmt(m) { m = Math.round(m || 0); return Math.floor(m / 60) + " ساعت " + m % 60 + " دقیقه"; }

        function pct(a, b) { return b ? Math.min(100, Math.round(a / b * 100)) : 0; }

        function all() { var m = state.sessions.reduce(function(a, x) { return a + Number(x.minutes || 0); }, 0);
            var t = state.tests.reduce(function(a, x) { return a + Number(x.count || 0); }, 0);
            var c = state.tests.reduce(function(a, x) { return a + Number(x.correct || 0); }, 0);
            return { m: m, t: t, c: c, rate: t ? Math.round(c / t * 100) : 0 }; }

        function subStat(name) { var ss = state.sessions.filter(function(x) { return x.subject === name; });
            var tt = state.tests.filter(function(x) { return x.subject === name; });
            var m = ss.reduce(function(a, x) { return a + Number(x.minutes || 0); }, 0);
            var t = tt.reduce(function(a, x) { return a + Number(x.count || 0); }, 0);
            var c = tt.reduce(function(a, x) { return a + Number(x.correct || 0); }, 0);
            return { m: m, t: t, rate: t ? Math.round(c / t * 100) : 0 }; }

        function streak() { var n = 0,
                d = new Date();
            if (mins(key(d)) + tests(key(d)) <= 0) d.setDate(d.getDate() - 1);
            while (mins(key(d)) + tests(key(d)) > 0) { n++;
                d.setDate(d.getDate() - 1); }
            return n; }

        function getXP() { var a = all(); return Math.floor(a.m / 6) + Math.floor(a.t / 2); }

        function getLevel() { return Math.floor(Math.sqrt(getXP() / 50)) + 1; }

        function getBadges() { var b = [],
                a = all(),
                h = Math.floor(a.m / 60),
                s = streak();
            if (h >= 1) b.push({ i: "🌱", n: "شروع مسیر", d: "اولین ساعت مطالعه" });
            if (h >= 100) b.push({ i: "📚", n: "کتاب‌خور", d: "۱۰۰ ساعت مطالعه" });
            if (a.t >= 5000) b.push({ i: "⚙️", n: "ماشین تست", d: "۵۰۰۰ تست زده‌شده" });
            if (s >= 7) b.push({ i: "🔥", n: "آتشین", d: "۷ روز مطالعه متوالی" });
            if (s >= 30) b.push({ i: "🛡️", n: "اراده پولادین", d: "۳۰ روز متوالی (بسیار سخت)" });
            if (h >= 1000 && a.t >= 30000) b.push({ i: "👑", n: "افسانه کنکور", d: "۱۰۰۰ ساعت + ۳۰هزار تست (نهایی)" });
            return b; }

        function toast(t) { var e = document.getElementById("toast");
            e.textContent = t;
            e.classList.add("show");
            setTimeout(function() { e.classList.remove("show"); }, 1800); }

        function showModal(title, body, ok) { var m = document.getElementById("modal");
            m.classList.remove("hidden");
            m.innerHTML =
                '<div class="modal-box"><h3>' + title + '</h3>' + body +
                '<div class="modal-actions"><button class="btn" id="modalCancel">بستن / لغو</button><button class="btn primary" id="modalOK" style="' +
                (!ok ? 'display:none' : '') + '">تأیید</button></div></div>';
            document.getElementById("modalCancel").onclick = function() { m.classList.add("hidden"); };
            if (ok) document.getElementById("modalOK").onclick = function() { ok();
                m.classList.add("hidden"); }; }

        function chart(n) { n = n || 14; var a = [],
                max = 60;
            for (var i = n - 1; i >= 0; i--) { var d = new Date();
                d.setDate(d.getDate() - i); var k = key(d),
                    m = mins(k);
                a.push({ d: d, m: m });
                max = Math.max(max, m); }
            return '<div class="chart">' + a.map(function(x) { return '<div class="barwrap"><div class="bar" style="height:' +
                    Math.max(2, x.m / max * 82) + '%" title="' + fmt(x.m) +
                    '"></div><div class="barlabel">' + new Intl.DateTimeFormat("fa-IR", { weekday: "short" }).format(x.d) +
                    '</div></div>'; }).join("") + '</div>'; }

        function heatmap() { var html = '<div class="heatmap-wrap"><div class="heatmap">';
            for (var i = 139; i >= 0; i--) { var d = new Date();
                d.setDate(d.getDate() - i); var m = mins(key(d)),
                    c = "lvl0";
                if (m > 0) c = "lvl1";
                if (m > 120) c = "lvl2";
                if (m > 240) c = "lvl3";
                if (m > 420) c = "lvl4";
                html += '<div class="heatmap-cell ' + c + '" title="' + faDate(d) + ' : ' + fmt(m) + '"></div>'; }
            return html + '</div></div>'; }

        function dash() { var a = all(),
                k = key(),
                tm = mins(k),
                tt = tests(k),
                done = Math.round((pct(tm, state.targetHours * 60) + pct(tt, state.targetTests)) / 2),
                days_count = state.sessions.length ? new Set(state.sessions.map(function(x) { return x.date; })).size : 0;
            var elapsed = Math.max(0, 304 - remain()),
                prog = Math.min(100, Math.round(elapsed / 304 * 100));
            var todayReminders = state.reminders.filter(function(r) { return r.date === k; });
            var todayGoals = state.goals.filter(function(g) { return g.date === k || (g.recurring && !(g.doneDate || [])
                    .includes(k)); });
            return '\n<div class="grid g3">\n  <div class="card" style="grid-column: 1 / -1; background:linear-gradient(135deg,#1b2037,#26204b);border-color:#6658bd55;padding:18px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;">\n    <div style="font-size:32px;">👋</div>\n    <div>\n      <div style="font-size:18px;font-weight:800;">خوش اومدی <span style="color:var(--cyan);">' +
                USER_NAME + '</span> جان!</div>\n      <div class="muted" style="margin-top:3px;">امروز هم یک قدم به موفقیت در مسیر کنکور نزدیک‌تر شو.</div>\n    </div>\n  </div>\n</div>\n\n<div class="grid g4" style="margin-top:16px;">\n<div class="card stat"><div class="ico">⏱️</div><div class="label">مطالعه کل</div><div class="num">' +
                fmt(a.m) + '</div><div class="sub">' + days_count + ' روز مطالعه</div></div>\n<div class="card stat"><div class="ico">📝</div><div class="label">تست کل</div><div class="num">' +
                a.t + '</div><div class="sub">' + a.rate + '% پاسخ صحیح</div></div>\n<div class="card stat"><div class="ico">🔥</div><div class="label">Streak</div><div class="num">' +
                streak() + '</div><div class="sub">روز متوالی</div></div>\n<div class="card stat" style="text-align:center;"><div class="label" style="margin-top:0">سطح شما</div><div class="num" style="color:var(--orange)">Lvl ' +
                getLevel() + '</div><div class="sub">' + getXP() + ' XP کسب شده</div></div>\n</div>\n\n<div class="grid g2" style="margin-top:16px;">\n  <div class="card hero"><div class="hero-row"><div><div class="muted">⏳ شمارش معکوس کنکور</div><div class="count">' +
                remain() + ' روز</div><div class="muted">۱۰ تیر ۱۴۰۶</div></div><div class="ring" style="--p:' + Math.max(2,
                    prog) + '%" data-text="' + prog + '%"></div></div><div style="margin-top:18px;position:relative;z-index:1"><div class="muted">پیشرفت زمانی مسیر</div><div class="progress" style="margin-top:8px"><i style="width:' +
                prog + '%"></i></div></div></div>\n  <div class="card">\n    <div class="section-title" style="margin-top:0"><h2>🔔 یادآوری و اهداف امروز</h2></div>\n    ' +
                (todayReminders.length ? todayReminders.map(function(r) { return '<div class="reminder-item">⏰ <b>یادآوری:</b> ' +
                    r.text + '</div>'; }).join("") : '') +
                (todayGoals.length ? todayGoals.map(function(g) { return '<div class="goal-item ' + (g.done ? 'done' : '') +
                    '"><div><b>' + g.title + '</b> ' + (g.recurring ?
                        '<span class="pomodoro-badge">تکرارشونده</span>' : '') + '<div class="muted" style="font-size:10px">' +
                    (g.value || '') + '</div></div><input type="checkbox" class="goal-check" data-id="' + g.id + '" ' + (g
                        .done ? 'checked' : '') + '></div>'; }).join("") : '') +
                ((!todayReminders.length && !todayGoals.length) ? '<div class="empty">برای امروز هدف یا یادآوری ثبت نشده.</div>' :
                    '') +
                '\n  </div>\n</div>\n\n<div class="section-title"><h2>☀️ وضعیت امروز</h2><button class="btn primary" data-go="today">+ ثبت مطالعه / تست</button></div>\n<div class="grid g4">\n<div class="card"><div class="label">هدف مطالعه</div><div class="kpi">' +
                state.targetHours + ' ساعت</div><div class="mini">واقعی: ' + fmt(tm) +
                '</div><div class="progress" style="margin-top:11px"><i style="width:' + pct(tm, state.targetHours * 60) +
                '%"></i></div></div>\n<div class="card"><div class="label">هدف تست</div><div class="kpi">' + state.targetTests +
                '</div><div class="mini">واقعی: ' + tt +
                '</div><div class="progress" style="margin-top:11px"><i style="width:' + pct(tt, state.targetTests) +
                '%"></i></div></div>\n<div class="card"><div class="label">تحقق امروز</div><div class="kpi">' + done +
                '%</div><div class="mini">مطالعه + تست</div></div>\n<div class="card"><div class="label">تاریخ امروز</div><div class="kpi" style="font-size:16px">' +
                faDate() + '</div><div class="mini">شروع مسیر: ' + state.startDate + '</div></div>\n</div>'; }

        function sessionTable(rows) { if (!rows.length) return '<div class="empty">جلسه‌ای برای این روز ثبت نشده.</div>';
            return '<div class="table-wrap"><table class="table"><tr><th>درس</th><th>مبحث</th><th>نوع</th><th>مدت</th><th>عملیات</th></tr>' +
                rows.map(function(x) { return '<tr><td>' + x.subject + '</td><td>' + (x.topic || "—") +
                    '</td><td><span class="pill">' + x.type + '</span></td><td>' + fmt(x.minutes) +
                    '</td><td><button class="btn danger ds" data-id="' + x.id + '">حذف</button></td></tr>'; }).join(
                    "") + '</table></div>'; }

        function testTable(rows) { if (!rows.length) return '<div class="empty">تستی برای این روز ثبت نشده.</div>';
            return '<div class="table-wrap"><table class="table"><tr><th>درس</th><th>مبحث/منبع</th><th>تعداد</th><th>صحیح/غلط/نزده</th><th>مارک‌دار</th><th>عملیات</th></tr>' +
                rows.map(function(x) { return '<tr><td>' + x.subject + '</td><td>' + (x.topic || "—") +
                    ' <br><small class="muted">' + (x.source || "") +
                    '</small></td><td>' + x.count + '</td><td><span class="good">' + (x.correct || 0) +
                    '</span> / <span class="bad">' + (x.wrong || 0) + '</span> / <span class="neutral">' + (x
                        .blank || 0) + '</span></td><td>' + (x.marked || 0) +
                    '</td><td><button class="btn danger dt" data-id="' + x.id + '">حذف</button></td></tr>'; }).join(
                    "") + '</table></div>'; }

        function today() { var k = key(),
                tm = mins(k),
                tt = tests(k),
                d = state.days[k] || {};
            return '\n<div class="grid g3"><div class="card"><div class="label">مطالعه امروز</div><div class="num">' + fmt(tm) +
                '</div><div class="mini">هدف: ' + state.targetHours + ' ساعت</div></div><div class="card"><div class="label">تست امروز</div><div class="num">' +
                tt + '</div><div class="mini">هدف: ' + state.targetTests +
                '</div></div><div class="card"><div class="label">تحقق امروز</div><div class="num">' + Math.round((pct(tm,
                    state.targetHours * 60) + pct(tt, state.targetTests)) / 2) +
                '%</div></div></div>\n<div class="section-title"><h2>➕ ثبت جلسه مطالعه</h2></div><div class="card"><form id="sf" class="form"><div class="grid g3"><label>درس<select name="subject">' +
                state.subjects.map(function(s) { return '<option>' + s.name + '</option>'; }).join("") +
                '</select></label><label>مبحث<input name="topic" placeholder="مثلاً مشتق"></label><label>مدت (دقیقه)<input name="minutes" type="number" min="1" required value="60"></label></div><div class="grid g2"><label>نوع فعالیت<select name="type"><option>آموزش</option><option>تست</option><option>مرور</option><option>جمع‌بندی</option><option>رفع اشکال</option></select></label><label>توضیحات<input name="note" placeholder="اختیاری"></label></div><button class="btn primary">ثبت جلسه</button></form></div>\n<div class="section-title"><h2>📝 ثبت تست</h2></div><div class="card"><form id="tf" class="form"><div class="grid g4"><label>درس<select name="subject">' +
                state.subjects.map(function(s) { return '<option>' + s.name + '</option>'; }).join("") +
                '</select></label><label>مبحث<input name="topic"></label><label>تعداد<input name="count" type="number" min="1" required value="20"></label><label>منبع تست<input name="source" placeholder="گاج، خیلی‌سبز..."></label></div><div class="grid g4"><label>درست<input name="correct" type="number" min="0" required value="0"></label><label>غلط<input name="wrong" type="number" min="0" value="0"></label><label>نزده<input name="blank" type="number" min="0" value="0"></label><label>تست‌های مارک‌دار<input name="marked" type="number" min="0" value="0" placeholder="مهم و سخت"></label></div><button class="btn primary">ثبت تست</button></form></div>\n<div class="section-title"><h2>📋 گزارش و ارزیابی روز</h2></div><div class="card"><form id="df" class="form"><div class="grid g3"><label>انرژی (۱–۵)<input name="energy" type="number" min="1" max="5" value="' +
                (d.energy || 3) +
                '"></label><label>تمرکز (۱–۵)<input name="focus" type="number" min="1" max="5" value="' + (d.focus || 3) +
                '"></label><label>وضعیت روز<select name="status">' + ["عالی", "خوب", "متوسط", "ضعیف"].map(function(x) {
                    return '<option ' + (d.status === x ? "selected" : "") + '>' + x + '</option>'; }).join(
                    "") + '</select></label></div><label>گزارش و افکار<textarea name="note" rows="3">' + (d.note || "") +
                '</textarea></label><button class="btn primary">ذخیره گزارش</button></form></div>\n<div class="section-title"><h2>🕘 جلسات ثبت‌شده امروز</h2></div><div class="card">' +
                sessionTable(state.sessions.filter(function(x) { return x.date === k; })) +
                '</div>\n<div class="section-title"><h2>📝 تست‌های ثبت‌شده امروز</h2></div><div class="card">' + testTable(
                    state.tests.filter(function(x) { return x.date === k; })) + '</div>'; }

        window.daysPage = window.daysPage || 1;

        function getDaysList() { var startD = new Date(state.startDate);
            var todayD = new Date();

                            testTable(dayTests) +
                            '\n                <div class="section-title" style="margin-top:15px"><h3>➕ افزودن تست جدید به این روز</h3></div>\n                <div class="form">\n                    <div class="grid g4">\n                      <select id="etSub">' +
                            state.subjects.map(function(s) { return '<option>' + s.name + '</option>'; })
                            .join("") +
                            '</select>\n                      <input id="etCount" type="number" placeholder="تعداد تست">\n                      <input id="etCorrect" type="number" placeholder="تعداد صحیح">\n                      <input id="etWrong" type="number" placeholder="تعداد غلط">\n                    </div>\n                    <button class="btn primary" id="etSave">اضافه کردن تست</button>\n                </div>\n            </div>\n        ');
                        document.getElementById("modal").querySelectorAll(".ds").forEach(function(db) { db
                                .onclick = function() { state.sessions = state.sessions.filter(function(
                                        x) { return x.id != db.dataset.id; });
                                    save();
                                    toast("جلسه حذف شد");
                                    document.getElementById("modal").classList.add("hidden");
                                    render("days"); }; });
                        document.getElementById("modal").querySelectorAll(".dt").forEach(function(db) { db
                                .onclick = function() { state.tests = state.tests.filter(function(x) { return x
                                            .id != db.dataset.id; });
                                    save();
                                    toast("تست حذف شد");
                                    document.getElementById("modal").classList.add("hidden");
                                    render("days"); }; });
                        document.getElementById("emSave").onclick = function() {
                            var m = +document.getElementById("emMin").value;
                            if (!m) return toast("زمان وارد نشده!");
                            state.sessions.push({ id: Date.now(), date: dateK, subject: document
                                    .getElementById("emSub").value, minutes: m, type: document
                                    .getElementById("emType").value });
                            save();
                            toast("جلسه اضافه شد");
                            document.getElementById("modal").classList.add("hidden");
                            render("days");
                        };
                        document.getElementById("etSave").onclick = function() {
                            var c = +document.getElementById("etCount").value;
                            if (!c) return toast("تعداد تست وارد نشده!");
                            state.tests.push({ id: Date.now(), date: dateK, subject: document
                                    .getElementById("etSub").value, count: c, correct: +document
                                    .getElementById("etCorrect").value || 0, wrong: +document
                                    .getElementById("etWrong").value || 0, blank: 0, marked: 0 });
                            save();
                            toast("تست اضافه شد");
                            document.getElementById("modal").classList.add("hidden");
                            render("days");
                        };
                    };
                });
            }
            if (page === "subjects") {
                var addSub = document.getElementById("addSub");
                if (addSub) addSub.onclick = function() { showModal("افزودن درس",
                        '<div class="form"><label>نام درس (مثلاً: زیست‌شناسی)<input id="newSub"></label></div>',
                        function() { var n = document.getElementById("newSub")?.value.trim(); if (n) { state
                                .subjects.push({ name: n });
                            save();
                            toast("درس اضافه شد");
                            render("subjects"); } }); };
            }
            if (page === "exams") {
                var examForm = document.getElementById("examForm");
                if (examForm) examForm.onsubmit = function(e) { e.preventDefault(); var f = new FormData(e.target);
                    var percs = {};
                    state.subjects.forEach(function(s) { var p = f.get("p_" + s.name); if (p !== "") percs[s
                            .name] = +p; });
                    state.exams.push({ id: Date.now(), date: f.get("date"), taraz: +f.get("taraz"), rank: f.get(
                            "rank"), note: f.get("note"), percentages: percs });
                    save();
                    toast("آزمون و درصدها ثبت شد");
                    render("exams"); };
                document.querySelectorAll(".de").forEach(function(b) { b.onclick = function() { state.exams = state
                            .exams.filter(function(x) { return x.id != b.dataset.id; });
                        save();
                        render("exams"); }; });
                document.querySelectorAll(".view-exam").forEach(function(b) {
                    b.onclick = function() {
                        var ex = state.exams.find(function(x) { return x.id == b.dataset.id; });
                        if (!ex || !ex.percentages || Object.keys(ex.percentages).length === 0) return toast(
                            "درصدی برای این آزمون ثبت نشده");
                        var html =
                            '<div class="table-wrap"><table class="table"><tr><th>درس</th><th>درصد کسب شده</th></tr>';
                        for (var s in ex.percentages) {
                            var p = ex.percentages[s];
                            html += '<tr><td>' + s + '</td><td class="' + (p >= 70 ? "good" : p < 30 ? "bad" :
                                "neutral") + '">' + p + '%</td></tr>';
                        }
                        html += '</table></div>';
                        showModal('درصدهای آزمون ' + ex.date, html);
                    };
                });
            }
            if (page === "goals") {
                var addGoal = document.getElementById("addGoal");
                if (addGoal) addGoal.onclick = function() { showModal("افزودن هدف",
                        '<div class="form"><label>تاریخ هدف<input id="gd" type="date" value="' + key() +
                        '"></label><label>عنوان هدف<input id="gt"></label><label>توضیح/مقدار<input id="gv"></label><div class="switch" style="padding:10px;"><label>تکرارشونده هر روز؟</label><input type="checkbox" id="gRec"></div></div>',
                        function() { var t = document.getElementById("gt")?.value.trim(); if (t) { state
                                .goals.push({ id: Date.now(), date: document.getElementById("gd").value,
                                    title: t, value: document.getElementById("gv")?.value || "",
                                    done: false, recurring: document.getElementById("gRec").checked,
                                    doneDate: [] });
                            save();
                            render("goals"); } }); };
                var addReminder = document.getElementById("addReminder");
                if (addReminder) addReminder.onclick = function() { showModal("افزودن یادآوری",
                        '<div class="form"><label>تاریخ یادآوری<input id="rd" type="date" value="' + key() +
                        '"></label><label>متن یادآوری<input id="rt"></label></div>',
                    function() { var t = document.getElementById("rt")?.value.trim(); if (t) { state
                            .reminders.push({ id: Date.now(), date: document.getElementById("rd").value,
                                text: t });
                        save();
                        render("goals"); } }); };
                document.querySelectorAll(".dg").forEach(function(b) { b.onclick = function() { state.goals = state
                            .goals.filter(function(g) { return g.id != b.dataset.id; });
                        save();
                        render("goals"); }; });
                document.querySelectorAll(".dr").forEach(function(b) { b.onclick = function() { state.reminders = state
                            .reminders.filter(function(r) { return r.id != b.dataset.id; });
                        save();
                        render("goals"); }; });
            }
            if (page === "timer") {
                document.querySelectorAll("[data-mode]").forEach(function(b) {
                    b.onclick = function() { clearInterval(timer.interval);
                        timer.running = false;
                        timer.isPaused = false;
                        timer.mode = b.dataset.mode;
                        timer.sec = b.dataset.mode === "countdown" ? 1500 : (b.dataset.mode === "pomodoro" ?
                            1500 : 0);
                        render("timer"); };
                });
                var applyBtn = document.getElementById("applyTime");
                if (applyBtn) applyBtn.onclick = function() { var h = +document.getElementById("th").value || 0;
                    var m = +document.getElementById("tm").value || 0;
                    var s = +document.getElementById("ts").value || 0;
                    timer.sec = h * 3600 + m * 60 + s;
                    toast("زمان تنظیم شد");
                    document.getElementById("td").textContent = clock(timer.sec); };
                var startBtn = document.getElementById("start");
                if (startBtn) startBtn.onclick = function() {
                    if (timer.running && !timer.isPaused) {
                        clearInterval(timer.interval);
                        timer.running = false;
                        timer.lastElapsed = timer.mode === "stopwatch" ? timer.sec : timer.sec ? timer
                            .lastElapsed : 0;
                        toast("تایمر کاملاً متوقف شد");
                        render("timer");
                    } else {
                        timer.running = true;
                        timer.isPaused = false;
                        timer.lastStart = Date.now();
                        timer.interval = setInterval(function() {
                            timer.mode === "stopwatch" ? timer.sec++ : timer.sec--;
                            if ((timer.mode === "countdown" || timer.mode === "pomodoro") && timer
                                .sec <= 0) {
                                timer.sec = 0;
                                clearInterval(timer.interval);
                                timer.running = false;
                                if (timer.mode === "pomodoro") {
                                    timer.pomodoroCount++;
                                    toast("🍅 یک پومودورو تکمیل شد! استراحت کن.");
                                    timer.sec = 5 * 60;
                                } else {
                                    toast("⏰ زمان تمام شد");
                                }
                                timer.lastElapsed = timer.lastStart ? Math.round((Date.now() - timer
                                    .lastStart) / 1000) : 0;
                            }
                            var el = document.getElementById("td");
                            if (el) el.textContent = clock(timer.sec);
                        }, 1000);
                        render("timer");
                    }
                };
                var pauseBtn = document.getElementById("pauseBtn");
                if (pauseBtn) pauseBtn.onclick = function() { clearInterval(timer.interval);
                    timer.isPaused = true;
                    toast("تایمر موقتاً متوقف شد (مکث)");
                    render("timer"); };
                var resetBtn = document.getElementById("reset");
                if (resetBtn) resetBtn.onclick = function() { clearInterval(timer.interval);
                    timer.running = false;
                    timer.isPaused = false;
                    timer.sec = timer.mode === "countdown" ? 1500 : (timer.mode === "pomodoro" ? 1500 : 0);
                    timer.lastElapsed = 0;
                    render("timer"); };
                var saveTimerBtn = document.getElementById("saveTimer");
                if (saveTimerBtn) saveTimerBtn.onclick = function() {
                    var sec = timer.mode === "stopwatch" ? timer.sec : (timer.lastElapsed || 0);
                    if (timer.mode === "pomodoro") sec = timer.pomodoroCount * 25 * 60;
                    var m = Math.floor(sec / 60);
                    if (m < 1) { toast("حداقل یک دقیقه برای ثبت لازم است"); return; }
                    state.sessions.push({ id: Date.now(), date: key(), subject: document.getElementById(
                            "tSub").value, topic: document.getElementById("tTopic").value, minutes: m,
                        type: "مطالعه با تایمر", note: "ثبت‌شده از تایمر (" + timer.mode + ")" });
                    save();
                    timer.lastElapsed = 0;
                    timer.pomodoroCount = 0;
                    toast(m + " دقیقه مطالعه ثبت شد");
                    render("timer");
                };
                document.querySelectorAll(".sound-btn").forEach(function(b) {
                    b.onclick = function() {
                        var s = b.dataset.sound;
                        if (window.audioSounds[s].paused) {
                            window.audioSounds[s].play();
                            b.classList.add("playing");
                        } else {
                            window.audioSounds[s].pause();
                            b.classList.remove("playing");
                        }
                    };
                });
            }
            if (page === "settings") {
                var setf = document.getElementById("setf");
                if (setf) setf.onsubmit = function(e) { e.preventDefault(); var f = new FormData(e.target);
                    state.targetHours = +f.get("hours");
                    state.targetTests = +f.get("tests");
                    save();
                    toast("تنظیمات ذخیره شد");
                    render("settings"); };
                var largeFont = document.getElementById("largeFont");
                if (largeFont) largeFont.onchange = function(e) { state.compact = !e.target.checked;
                    document.body.style.fontSize = state.compact ? "13px" : "14px";
                    save(); };
                var savePass = document.getElementById("savePass");
                if (savePass) savePass.onclick = function() { var p = document.getElementById("appPassword").value;
                    localStorage.setItem("sfx_pass", p);
                    toast("رمز ورود ذخیره شد"); };
                var exportBtn = document.getElementById("export");
                if (exportBtn) exportBtn.onclick = function() { var blob = new Blob([JSON.stringify(state, null, 2)], {
                        type: "application/json" });
                    var a = document.createElement("a");
                    a.href = URL.createObjectURL(blob);
                    a.download = "konkur-backup.json";
                    a.click();
                    setTimeout(function() { URL.revokeObjectURL(a.href); }, 500); };
                var importInput = document.getElementById("import");
                if (importInput) importInput.onchange = function(e) { var file = e.target.files[0]; if (!file) return;
                    var r = new FileReader();
                    r.onload = function() { try { state = JSON.parse(r.result);
                            save();
                            toast("پشتیبان وارد شد");
                            render("dashboard"); } catch (e) { toast("فایل پشتیبان معتبر نیست"); } };
                    r.readAsText(file); };
                var resetBtn = document.getElementById("reset");
                if (resetBtn) resetBtn.onclick = function() { if (confirm(
                        "همه اطلاعات برای همیشه پاک شود؟ دقت کن که غیر قابل برگشت است!")) { localStorage.removeItem(
                            KEY);
                        location.reload(); } };
            }
        }

        // ===== NAVIGATION =====
        document.querySelectorAll(".nav").forEach(function(b) {
            b.onclick = function() {
                render(b.dataset.page);
            };
        });

        // ===== INIT =====
        render("dashboard");
    </script>
</body>
</html>
